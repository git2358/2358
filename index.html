<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>git2358 — GitHub Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: #0d1117;
      color: #e6edf3;
    }

    a {
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #010409;
      border-bottom: 1px solid #30363d;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;

      font-weight: 600;
      font-size: 18px;
    }

    .github-icon {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .github-link {
      color: #8b949e;
      text-decoration: none;
      font-size: 14px;
    }

    .github-link:hover {
      color: #58a6ff;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 50px 20px 80px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile {
      display: flex;
      gap: 28px;
      align-items: center;

      margin-bottom: 45px;
    }

    .avatar {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      border: 1px solid #30363d;

      background: #161b22;

      object-fit: cover;
    }

    .profile-info h1 {
      margin: 0 0 6px;

      font-size: 32px;
      font-weight: 600;
    }

    .username {
      color: #8b949e;
      font-size: 20px;

      margin-bottom: 14px;
    }

    .profile-description {
      color: #8b949e;

      line-height: 1.6;

      max-width: 650px;
    }

    /* =========================
       REPOSITORY HEADER
    ========================= */

    .repo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 20px;
    }

    .repo-header h2 {
      margin: 0;

      font-size: 20px;
      font-weight: 600;
    }

    .search {
      width: 280px;

      padding: 9px 12px;

      border-radius: 6px;

      border: 1px solid #30363d;

      background: #0d1117;
      color: #e6edf3;

      outline: none;

      font-size: 14px;
    }

    .search:focus {
      border-color: #58a6ff;

      box-shadow:
        0 0 0 2px rgba(56,139,253,.25);
    }

    /* =========================
       REPOSITORIES
    ========================= */

    #repos {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .repo {
      border: 1px solid #30363d;

      border-radius: 6px;

      padding: 20px;

      background: #0d1117;

      text-decoration: none;

      transition:
        border-color .15s ease,
        background .15s ease;
    }

    .repo:hover {
      border-color: #58a6ff;
      background: #161b22;
    }

    .repo-name {
      color: #58a6ff;

      font-size: 17px;

      font-weight: 600;

      margin-bottom: 10px;

      word-break: break-word;
    }

    .repo-name::before {
      content: "▣";

      margin-right: 8px;

      color: #8b949e;
    }

    .repo-description {
      color: #8b949e;

      font-size: 14px;

      line-height: 1.5;

      min-height: 42px;

      margin-bottom: 18px;
    }

    /* =========================
       META
    ========================= */

    .repo-meta {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 16px;

      color: #8b949e;

      font-size: 12px;

      margin-bottom: 18px;
    }

    .language {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .language-dot {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #8b949e;
    }

    .stars,
    .forks {
      white-space: nowrap;
    }

    .updated {
      color: #6e7681;
    }

    /* =========================
       REPOSITORY LINKS
    ========================= */

    .repo-links {
      display: flex;

      gap: 8px;

      padding-top: 14px;

      border-top: 1px solid #21262d;
    }

    .repo-button {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 6px 10px;

      border-radius: 6px;

      border: 1px solid #30363d;

      background: #21262d;

      color: #e6edf3;

      font-size: 12px;

      text-decoration: none;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .repo-button:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    .repo-button.live {
      color: #58a6ff;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;

      padding: 40px;

      text-align: center;

      border: 1px solid #30363d;

      border-radius: 6px;

      color: #8b949e;
    }

    .error {
      color: #f85149;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #21262d;

      text-align: center;

      padding: 30px 20px;

      color: #6e7681;

      font-size: 13px;
    }

    footer a {
      color: #58a6ff;

      text-decoration: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      main {
        padding-top: 30px;
      }

      .profile {
        align-items: flex-start;
      }

      .avatar {
        width: 80px;
        height: 80px;
      }

      .profile-info h1 {
        font-size: 25px;
      }

      .username {
        font-size: 17px;
      }

      .repo-header {
        align-items: stretch;

        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      #repos {
        grid-template-columns: 1fr;
      }

      .repo-links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <a
      class="brand"
      href="https://github.com/git2358"
      target="_blank"
      rel="noopener"
    >

      <svg
        class="github-icon"
        viewBox="0 0 16 16"
        aria-hidden="true"
      >
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53
        5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49
        -2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53
        .63-.01 1.08.58 1.23.82
        .72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07
        -1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12
        0 0 .67-.21 2.2.82
        .64-.18 1.32-.27 2-.27
        .68 0 1.36.09 2 .27
        1.53-1.04 2.2-.82 2.2-.82
        .44 1.1.16 1.92.08 2.12
        .51.56.82 1.27.82 2.15
        0 3.07-1.87 3.75-3.65 3.95
        .29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2
        0 .21.15.46.55.38A8.01 8.01 0 0 0
        16 8c0-4.42-3.58-8-8-8z">
        </path>
      </svg>

      <span>git2358</span>

    </a>

    <a
      class="github-link"
      href="https://github.com/git2358"
      target="_blank"
      rel="noopener"
    >
      View on GitHub →
    </a>

  </div>

</header>


<main>

  <!-- PROFILE -->

  <section class="profile">

    <img
      id="avatar"
      class="avatar"
      src=""
      alt="git2358 avatar"
    >

    <div class="profile-info">

      <h1 id="displayName">
        git2358
      </h1>

      <div class="username">
        @git2358
      </div>

      <div
        id="profileDescription"
        class="profile-description"
      >
        Loading GitHub profile...
      </div>

    </div>

  </section>


  <!-- REPOSITORIES -->

  <section>

    <div class="repo-header">

      <h2>
        Repositories
      </h2>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Find a repository..."
        aria-label="Search repositories"
      >

    </div>

    <div id="repos">

      <div class="loading">
        Loading repositories...
      </div>

    </div>

  </section>

</main>


<footer>

  <a
    href="https://github.com/git2358"
    target="_blank"
    rel="noopener"
  >
    github.com/git2358
  </a>

</footer>


<script>

  const username = "git2358";

  const reposContainer =
    document.getElementById("repos");

  const search =
    document.getElementById("search");

  let repositories = [];


  /*
   * =========================
   * LOAD PROFILE
   * =========================
   */

  async function loadProfile() {

    try {

      const response =
        await fetch(
          `https://api.github.com/users/${username}`
        );

      if (!response.ok) {
        throw new Error(
          `GitHub returned ${response.status}`
        );
      }

      const user =
        await response.json();

      document.getElementById("avatar").src =
        user.avatar_url;

      document.getElementById("displayName").textContent =
        user.name || username;

      document.getElementById("profileDescription").textContent =
        user.bio ||
        "GitHub projects and experiments by git2358.";

    } catch (error) {

      console.error(error);

      document.getElementById(
        "profileDescription"
      ).textContent =
        "GitHub projects and experiments by git2358.";

    }

  }


  /*
   * =========================
   * LOAD REPOSITORIES
   * =========================
   */

  async function loadRepositories() {

    try {

      const response =
        await fetch(
          `https://api.github.com/users/${username}/repos?type=owner&per_page=100&sort=updated`
        );

      if (!response.ok) {
        throw new Error(
          `GitHub returned ${response.status}`
        );
      }

      const data =
        await response.json();


      /*
       * Only include repositories:
       *
       * - owned by git2358
       * - NOT forks
       *
       * Starred repositories belonging
       * to somebody else are never returned.
       */

      repositories =
        data.filter(repo =>
          repo.owner.login.toLowerCase() ===
            username.toLowerCase() &&
          repo.fork === false
        );


      renderRepositories();

    } catch (error) {

      console.error(error);

      reposContainer.innerHTML = `
        <div class="error">
          Unable to load repositories from GitHub.
        </div>
      `;

    }

  }


  /*
   * =========================
   * RENDER REPOSITORIES
   * =========================
   */

  function renderRepositories() {

    const query =
      search.value
        .trim()
        .toLowerCase();


    const filtered =
      repositories.filter(repo => {

        return (
          repo.name.toLowerCase().includes(query) ||
          (repo.description || "")
            .toLowerCase()
            .includes(query)
        );

      });


    reposContainer.innerHTML = "";


    if (filtered.length === 0) {

      reposContainer.innerHTML = `
        <div class="empty">
          No repositories found.
        </div>
      `;

      return;

    }


    filtered.forEach(repo => {

      const item =
        document.createElement("div");

      item.className = "repo";


      const language =
        repo.language || "Other";


      const updated =
        formatDate(repo.updated_at);


      /*
       * GitHub Pages URL
       *
       * Example:
       *
       * git2358/zine
       *
       * becomes:
       *
       * https://git2358.github.io/zine/
       */

      const pagesUrl =
        `https://${username}.github.io/${encodeURIComponent(repo.name)}/`;


      item.innerHTML = `

        <div class="repo-name">
          ${escapeHTML(repo.name)}
        </div>

        <div class="repo-description">
          ${escapeHTML(
            repo.description ||
            "No description provided."
          )}
        </div>

        <div class="repo-meta">

          <span class="language">

            <span
              class="language-dot"
            ></span>

            ${escapeHTML(language)}

          </span>

          <span class="stars">
            ★ ${repo.stargazers_count}
          </span>

          <span class="forks">
            ⑂ ${repo.forks_count}
          </span>

          <span class="updated">
            Updated ${updated}
          </span>

        </div>

        <div class="repo-links">

          <a
            class="repo-button"
            href="${repo.html_url}"
            target="_blank"
            rel="noopener"
          >
            ◇ GitHub
          </a>

          <a
            class="repo-button live"
            href="${pagesUrl}"
            target="_blank"
            rel="noopener"
          >
            ↗ Live Site
          </a>

        </div>

      `;


      reposContainer.appendChild(item);

    });

  }


  /*
   * =========================
   * DATE
   * =========================
   */

  function formatDate(date) {

    const d =
      new Date(date);

    return d.toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

  }


  /*
   * =========================
   * HTML ESCAPING
   * =========================
   */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value;

    return div.innerHTML;

  }


  /*
   * =========================
   * SEARCH
   * =========================
   */

  search.addEventListener(
    "input",
    renderRepositories
  );


  /*
   * =========================
   * START
   * =========================
   */

  loadProfile();

  loadRepositories();

</script>

</body>
</html>
