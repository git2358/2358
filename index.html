<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2358">
  <meta name="mobile-web-app-capable" content="yes">

  <title>2358 — GitHub Projects</title>

  <link
    id="favicon"
    rel="icon"
    type="image/png"
    href="https://avatars.githubusercontent.com/git2358"
  >

  <link
    id="appleTouchIcon"
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://avatars.githubusercontent.com/git2358"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: #0d1117;
    }

    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(13, 17, 23, 0.92);
      border-bottom: 1px solid #30363d;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      width: 100%;
      max-width: 1500px;

      margin: 0 auto;
      padding: 14px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 10px;

      color: #e6edf3;

      font-size: 16px;
      font-weight: 700;
    }

    .github-icon {
      width: 24px;
      height: 24px;

      fill: currentColor;
    }

    .header-links {
      display: flex;
      align-items: center;

      gap: 18px;

      color: #8b949e;

      font-size: 14px;
    }

    .header-links a:hover {
      color: #e6edf3;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      width: 100%;
      max-width: 1500px;

      margin: 0 auto;

      padding: 42px 24px 80px;
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .profile {
      display: flex;
      align-items: center;

      gap: 24px;

      margin-bottom: 42px;
    }

    .avatar {
      width: 96px;
      height: 96px;

      flex: 0 0 auto;

      object-fit: cover;

      border-radius: 50%;
      border: 1px solid #30363d;

      background: #161b22;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      margin: 0;

      color: #e6edf3;

      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;

      word-break: break-word;
    }

    .profile-username {
      margin-top: 3px;

      color: #8b949e;

      font-size: 16px;
    }

    .profile-bio {
      max-width: 800px;

      margin: 12px 0 0;

      color: #8b949e;

      font-size: 15px;
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 18px;

      margin-top: 12px;

      color: #8b949e;

      font-size: 14px;
    }

    .profile-stats strong {
      color: #e6edf3;
      font-weight: 600;
    }

    /* =========================================================
       PROJECT HEADER
       ========================================================= */

    .projects-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }

    .projects-title {
      margin: 0;

      color: #e6edf3;

      font-size: 24px;
      line-height: 1.3;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;

      gap: 10px;

      min-width: 0;
    }

    .search {
      width: 280px;
      max-width: 100%;

      padding: 9px 12px;

      color: #e6edf3;
      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 6px;

      outline: none;

      font-size: 14px;
    }

    .search::placeholder {
      color: #6e7681;
    }

    .search:focus {
      border-color: #58a6ff;

      box-shadow:
        0 0 0 2px rgba(56, 139, 253, 0.15);
    }

    .sort {
      padding: 9px 12px;

      color: #e6edf3;
      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 6px;

      outline: none;

      font-size: 14px;

      cursor: pointer;
    }

    .sort:focus {
      border-color: #58a6ff;
    }

    /* =========================================================
       PROJECT GRID

       Mobile / iPhone: 2 columns
       iPad: 3 columns
       Desktop: 4 columns
       ========================================================= */

    #repos {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;
    }

    @media (min-width: 700px) {
      #repos {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1000px) {
      #repos {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }
    }

    /* =========================================================
       REPOSITORY CARD
       ========================================================= */

    .repo-card {
      min-width: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 10px;

      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .repo-card:hover {
      border-color: #58a6ff;

      transform: translateY(-2px);
    }

    /* =========================================================
       PROJECT PREVIEW
       ========================================================= */

    .repo-preview {
      position: relative;

      display: block;

      width: 100%;

      aspect-ratio: 1.91 / 1;

      overflow: hidden;

      background: #0d1117;
    }

    .repo-preview img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #0d1117;
    }

    /* =========================================================
       PROJECT CONTENT
       ========================================================= */

    .repo-content {
      display: flex;
      flex-direction: column;

      flex: 1;

      min-width: 0;

      padding: 17px;
    }

    .repo-name {
      margin: 0;

      color: #e6edf3;

      font-size: 17px;
      line-height: 1.35;
      font-weight: 600;

      word-break: break-word;
    }

    .repo-name a:hover {
      color: #58a6ff;
    }

    .repo-description {
      margin: 9px 0 0;

      color: #8b949e;

      font-size: 14px;
      line-height: 1.5;

      display: -webkit-box;

      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;

      overflow: hidden;
    }

    /* =========================================================
       TOPICS
       ========================================================= */

    .topics {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 13px;
    }

    .topic {
      display: inline-block;

      padding: 3px 8px;

      border-radius: 20px;

      color: #58a6ff;
      background: rgba(56, 139, 253, 0.12);

      font-size: 11px;
      line-height: 1.4;
    }

    /* =========================================================
       REPOSITORY META
       ========================================================= */

    .repo-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: auto;
      padding-top: 17px;

      color: #8b949e;

      font-size: 12px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;

      gap: 5px;
    }

    .language-dot {
      width: 10px;
      height: 10px;

      display: inline-block;

      flex: 0 0 auto;

      border-radius: 50%;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .repo-actions {
      display: flex;

      gap: 8px;

      margin-top: 17px;
    }

    .button {
      flex: 1;

      min-width: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 8px 10px;

      color: #e6edf3;
      background: #21262d;

      border: 1px solid #30363d;
      border-radius: 6px;

      font-size: 12px;
      font-weight: 600;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .button:hover {
      background: #30363d;

      border-color: #8b949e;
    }

    .button.primary {
      color: #ffffff;
      background: #238636;

      border-color: rgba(240, 246, 252, 0.1);
    }

    .button.primary:hover {
      background: #2ea043;
    }

    /* =========================================================
       LOADING / EMPTY / ERROR
       ========================================================= */

    .status {
      grid-column: 1 / -1;

      padding: 40px 20px;

      color: #8b949e;

      text-align: center;
    }

    .status strong {
      color: #e6edf3;
    }

    /* =========================================================
       TABLET / SMALL DESKTOP
       ========================================================= */

    @media (max-width: 900px) {
      .projects-header {
        align-items: stretch;

        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .search {
        flex: 1;

        width: auto;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {
      main {
        padding: 28px 14px 60px;
      }

      .header-inner {
        padding: 12px 14px;
      }

      .header-links {
        gap: 10px;
      }

      .profile {
        gap: 16px;

        margin-bottom: 30px;
      }

      .avatar {
        width: 72px;
        height: 72px;
      }

      .profile-name {
        font-size: 23px;
      }

      .profile-username {
        font-size: 14px;
      }

      .profile-bio {
        font-size: 13px;
      }

      .profile-stats {
        gap: 10px 14px;

        font-size: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .search,
      .sort {
        width: 100%;
      }

      #repos {
        gap: 12px;
      }

      .repo-content {
        padding: 12px;
      }

      .repo-description {
        font-size: 12px;

        -webkit-line-clamp: 3;
      }

      .repo-meta {
        gap: 8px;

        font-size: 10px;
      }

      .repo-actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 450px) {
      .profile {
        align-items: flex-start;
      }

      .profile-name {
        font-size: 20px;
      }

      .repo-preview {
        aspect-ratio: 1.8 / 1;
      }

      .repo-name {
        font-size: 14px;
      }

      .topic {
        padding: 2px 6px;

        font-size: 9px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header>
    <div class="header-inner">

      <a
        class="brand"
        href="https://github.com/git2358"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
      >

        <svg
          class="github-icon"
          viewBox="0 0 16 16"
          aria-hidden="true"
        >
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53
            5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94

        <span>2358</span>

      </a>

      <nav class="header-links">

        >

        </a>
      </nav>

    </div>
  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main>

    <!-- PROFILE -->

    <section
      class="profile"
      aria-label="GitHub profile"
    >

      <img
        id="avatar"
        class="avatar"
        src="https://avatars.githubusercontent.com/git2358"
        alt="GitHub profile avatar"
        width="96"
        height="96"
      >

      <div class="profile-info">

        <h1
          id="profileName"
          class="profile-name"
        >
          2358
        </h1>

        <div
          id="profileUsername"
          class="profile-username"
        >
          @git2358
        </div>

        <p
          id="profileBio"
          class="profile-bio"
        >
          GitHub projects and experiments.
        </p>

        <div class="profile-stats">

          <span>
            <strong id="repoCount">—</strong>
            repositories
          </span>

          <span>
            <strong id="followers">—</strong>
            followers
          </span>

          <span>
            <strong id="following">—</strong>
            following
          </span>

        </div>

      </div>

    </section>


    <!-- PROJECTS -->

    <section aria-label="GitHub projects">

      <div class="projects-header">

        <h2 class="projects-title">
          Projects
        </h2>

        <div class="controls">

          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search projects..."
            autocomplete="off"
            aria-label="Search projects"
          >

          <select
            id="sort"
            class="sort"
            aria-label="Sort projects"
          >
            <option value="updated">
              Recently updated
            </option>

            <option value="created">
              Recently created
            </option>

            <option value="name">
              Name
            </option>

            <option value="stars">
              Stars
            </option>
          </select>

        </div>

      </div>

      <div id="repos">

        <div class="status">
          Loading projects…
        </div>

      </div>

    </section>

  </main>


  <script>
    "use strict";

    /* =========================================================
       CONFIG
       ========================================================= */

    const USERNAME = "git2358";

    /*
      CHANGE THIS TIMESTAMP whenever you make a new version
      of the HTML.

      This replaces the old v2-style cache version.
    */
    const CACHE_VERSION = "2026-09-20-18";

    const CACHE_KEY =
      `git2358-repositories-${CACHE_VERSION}`;

    const CACHE_TIME_KEY =
      `git2358-repositories-time-${CACHE_VERSION}`;

    const CACHE_DURATION =
      5 * 60 * 1000;


    /* =========================================================
       DOM
       ========================================================= */

    const reposContainer =
      document.getElementById("repos");

    const searchInput =
      document.getElementById("search");

    const sortSelect =
      document.getElementById("sort");

    const avatar =
      document.getElementById("avatar");

    const profileName =
      document.getElementById("profileName");

    const profileUsername =
      document.getElementById("profileUsername");

    const profileBio =
      document.getElementById("profileBio");

    const repoCount =
      document.getElementById("repoCount");

    const followers =
      document.getElementById("followers");

    const following =
      document.getElementById("following");


    /* =========================================================
       STATE
       ========================================================= */

    let repositories = [];

    let currentRepositorySignature = "";


    /* =========================================================
       LANGUAGE COLOURS
       ========================================================= */

    const LANGUAGE_COLORS = {
      JavaScript: "#f1e05a",
      TypeScript: "#3178c6",
      HTML: "#e34c26",
      CSS: "#563d7c",
      Python: "#3572A5",
      Java: "#b07219",
      C: "#555555",
      "C++": "#f34b7d",
      "C#": "#178600",
      PHP: "#4F5D95",
      Ruby: "#701516",
      Go: "#00ADD8",
      Rust: "#dea584",
      Swift: "#F05138",
      Kotlin: "#A97BFF",
      Shell: "#89e051",
      Lua: "#000080",
      Dart: "#00B4AB",
      Vue: "#41b883",
      Svelte: "#ff3e00"
    };


    /* =========================================================
       GITHUB API
       ========================================================= */

    async function githubFetch(url) {
      const response = await fetch(url, {
        cache: "no-store",
        headers: {
          Accept: "application/vnd.github+json"
        }
      });

      if (!response.ok) {
        throw new Error(
          `GitHub API request failed: ${response.status}`
        );
      }

      return response.json();
    }


    /* =========================================================
       PROFILE
       ========================================================= */

    async function loadProfile() {
      try {
        const user = await githubFetch(
          `https://api.github.com/users/${USERNAME}`
        );

        profileName.textContent =
          user.name || USERNAME;

        profileUsername.textContent =
          `@${user.login}`;

        profileBio.textContent =
          user.bio ||
          "GitHub projects and experiments.";

        followers.textContent =
          user.followers;

        following.textContent =
          user.following;

        if (user.avatar_url) {
          avatar.src =
            user.avatar_url;

          document.getElementById(
            "favicon"
          ).href = user.avatar_url;

          document.getElementById(
            "appleTouchIcon"
          ).href = user.avatar_url;
        }

      } catch (error) {
        console.error(
          "Unable to load profile:",
          error
        );
      }
    }


    /* =========================================================
       STRICT REPOSITORY FILTER
       ========================================================= */

    function processRepositories(data) {
      if (!Array.isArray(data)) {
        return [];
      }

      const seen = new Set();

      return data.filter((repo) => {

        if (!repo) {
          return false;
        }

        if (!repo.owner) {
          return false;
        }

        if (!repo.owner.login) {
          return false;
        }

        /*
          OWNER CHECK

          Only repositories where the owner login is
          exactly git2358 are allowed.
        */
        if (
          repo.owner.login.toLowerCase() !==
          USERNAME.toLowerCase()
        ) {
          return false;
        }

        /*
          NEVER show forks.
        */
        if (repo.fork === true) {
          return false;
        }

        /*
          Extra protection using full_name.
        */
        if (repo.full_name) {
          const expectedPrefix =
            USERNAME.toLowerCase() + "/";

          if (
            !repo.full_name
              .toLowerCase()
              .startsWith(expectedPrefix)
          ) {
            return false;
          }
        }

        /*
          Remove duplicates.
        */
        const uniqueKey =
          repo.id ||
          repo.full_name ||
          repo.name;

        if (seen.has(uniqueKey)) {
          return false;
        }

        seen.add(uniqueKey);

        return true;
      });
    }


    /* =========================================================
       CACHE CLEANUP
       ========================================================= */

    function cleanOldCache() {
      try {

        /*
          Remove the old cache keys from the original version.
        */
        localStorage.removeItem(
          "git2358-repositories"
        );

        localStorage.removeItem(
          "git2358-repositories-time"
        );

        /*
          Remove older timestamped repository caches.

          Keep only the current cache version.
        */
        const keysToRemove = [];

        for (
          let i = 0;
          i < localStorage.length;
          i++
        ) {
          const key =
            localStorage.key(i);

          if (!key) {
            continue;
          }

          if (
            key.startsWith(
              "git2358-repositories-"
            ) &&
            key !== CACHE_KEY &&
            key !== CACHE_TIME_KEY
          ) {
            keysToRemove.push(key);
          }
        }

        keysToRemove.forEach(
          (key) => {
            localStorage.removeItem(key);
          }
        );

      } catch (error) {
        console.warn(
          "Unable to clean old cache:",
          error
        );
      }
    }


    /* =========================================================
       LOAD CACHE
       ========================================================= */

    function loadCachedRepositories() {
      try {

        const saved =
          localStorage.getItem(
            CACHE_KEY
          );

        const savedTime =
          localStorage.getItem(
            CACHE_TIME_KEY
          );

        if (!saved || !savedTime) {
          return false;
        }

        const timestamp =
          Number(savedTime);

        if (!Number.isFinite(timestamp)) {
          return false;
        }

        const age =
          Date.now() - timestamp;

        if (
          age < 0 ||
          age > CACHE_DURATION
        ) {
          return false;
        }

        const cached =
          JSON.parse(saved);

        if (!Array.isArray(cached)) {
          return false;
        }

        /*
          IMPORTANT:

          Filter the cache too.

          This prevents old/bad repository data from being
          displayed just because it exists in localStorage.
        */
        repositories =
          processRepositories(cached);

        currentRepositorySignature =
          createRepositorySignature(
            repositories
          );

        updateRepositoryCount();

        renderRepositories();

        return true;

      } catch (error) {
        console.warn(
          "Unable to load repository cache:",
          error
        );

        return false;
      }
    }


    /* =========================================================
       SAVE CACHE
       ========================================================= */

    function saveRepositoryCache(data) {
      try {

        const clean =
          processRepositories(data);

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(clean)
        );

        localStorage.setItem(
          CACHE_TIME_KEY,
          String(Date.now())
        );

      } catch (error) {
        console.warn(
          "Unable to save repository cache:",
          error
        );
      }
    }


    /* =========================================================
       REPOSITORY SIGNATURE
       ========================================================= */

    function createRepositorySignature(data) {
      return JSON.stringify(
        data.map((repo) => ({
          id: repo.id,
          full_name: repo.full_name,
          name: repo.name,
          fork: repo.fork,
          updated_at: repo.updated_at,
          description: repo.description,
          topics: repo.topics || [],
          language: repo.language,
          stars: repo.stargazers_count,
          forks: repo.forks_count
        }))
      );
    }


    /* =========================================================
       LOAD REPOSITORIES
       ========================================================= */

    async function loadRepositories() {
      try {

        const baseUrl =
          `https://api.github.com/users/${USERNAME}/repos`;

        let page = 1;

        let allRepositories = [];

        while (true) {

          /*
            IMPORTANT:

            type=owner explicitly tells GitHub that we only
            want repositories owned by git2358.

            GitHub documents this parameter as accepting:
              owner
              all
              member

            We deliberately use owner.
          */
          const url =
            `${baseUrl}?type=owner&per_page=100&page=${page}&sort=updated`;

          const pageData =
            await githubFetch(url);

          if (
            !Array.isArray(pageData) ||
            pageData.length === 0
          ) {
            break;
          }

          /*
            Filter EVERY page before adding it.
          */
          const cleanPage =
            processRepositories(
              pageData
            );

          allRepositories =
            allRepositories.concat(
              cleanPage
            );

          /*
            If fewer than 100 were returned,
            there are no more pages.
          */
          if (
            pageData.length < 100
          ) {
            break;
          }

          page++;
        }


        /*
          Final safety filter.
        */
        allRepositories =
          processRepositories(
            allRepositories
          );


        /*
          Remove duplicate IDs.
        */
        const unique =
          new Map();

        allRepositories.forEach(
          (repo) => {
            unique.set(
              repo.id,
              repo
            );
          }
        );

        allRepositories =
          Array.from(
            unique.values()
          );


        /*
          Compare with what is currently displayed.
        */
        const signature =
          createRepositorySignature(
            allRepositories
          );

        repositories =
          allRepositories;

        updateRepositoryCount();

        if (
          signature !==
          currentRepositorySignature
        ) {
          currentRepositorySignature =
            signature;

          renderRepositories();
        }

        /*
          Save ONLY the clean owner repositories.
        */
        saveRepositoryCache(
          repositories
        );

      } catch (error) {

        console.error(
          "Unable to load repositories:",
          error
        );

        /*
          If the API fails and there is no cached data,
          show an error.
        */
        if (
          repositories.length === 0
        ) {
          reposContainer.innerHTML = `
            <div class="status">
              <strong>
                Unable to load projects.
              </strong>
              <br>
              Please try again later.
            </div>
          `;
        }
      }
    }


    /* =========================================================
       REPOSITORY COUNT
       ========================================================= */

    function updateRepositoryCount() {
      repoCount.textContent =
        repositories.length;
    }


    /* =========================================================
       RENDER
       ========================================================= */

    function renderRepositories() {

      /*
        Search.
      */
      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      /*
        Sort.
      */
      const sort =
        sortSelect.value;


      /*
        FINAL DISPLAY FILTER

        This is another safety layer.

        Nothing gets rendered unless:
          owner = git2358
          fork = false
      */
      let filtered =
        repositories.filter(
          (repo) => {

            if (
              !repo.owner ||
              !repo.owner.login
            ) {
              return false;
            }

            if (
              repo.owner.login.toLowerCase() !==
              USERNAME.toLowerCase()
            ) {
              return false;
            }

            if (repo.fork === true) {
              return false;
            }

            return true;
          }
        );


      /*
        Search filtering.
      */
      if (query) {
        filtered =
          filtered.filter(
            (repo) => {

              const text = [
                repo.name,
                repo.description,
                ...(repo.topics || [])
              ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

              return text.includes(
                query
              );
            }
          );
      }


      /*
        Sorting.
      */
      filtered.sort(
        (a, b) => {

          switch (sort) {

            case "name":
              return a.name.localeCompare(
                b.name
              );

            case "created":
              return (
                new Date(b.created_at) -
                new Date(a.created_at)
              );

            case "stars":
              return (
                b.stargazers_count -
                a.stargazers_count
              );

            case "updated":
            default:
              return (
                new Date(b.updated_at) -
                new Date(a.updated_at)
              );
          }
        }
      );


      /*
        No results.
      */
      if (
        filtered.length === 0
      ) {
        reposContainer.innerHTML = `
          <div class="status">
            No projects found.
          </div>
        `;

        return;
      }


      /*
        Build the cards.
      */
      reposContainer.innerHTML =
        filtered
          .map(createRepositoryCard)
          .join("");
    }


    /* =========================================================
       REPOSITORY CARD
       ========================================================= */

    function createRepositoryCard(repo) {

      const imageUrl =
        `https://opengraph.githubassets.com/1/${USERNAME}/${repo.name}`;

      const githubUrl =
        repo.html_url;

      const liveUrl =
        `https://${USERNAME}.github.io/${repo.name}/`;

      const languageColor =
        getLanguageColor(
          repo.language
        );

      const topics =
        (repo.topics || [])
          .map(
            (topic) => `
              <span class="topic">
                ${escapeHTML(topic)}
              </span>
            `
          )
          .join("");


      return `
        <article class="repo-card">

          <a
            class="repo-preview"
            href="${escapeHTML(githubUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="${escapeHTML(imageUrl)}"
              alt="${escapeHTML(repo.name)} preview"
              loading="lazy"
            >
          </a>


          <div class="repo-content">

            <h3 class="repo-name">
              <a
                href="${escapeHTML(githubUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHTML(repo.name)}
              </a>
            </h3>


            <p class="repo-description">
              ${escapeHTML(
                repo.description ||
                "No description provided."
              )}
            </p>


            ${
              topics
                ? `
                  <div class="topics">
                    ${topics}
                  </div>
                `
                : ""
            }


            <div class="repo-meta">

              ${
                repo.language
                  ? `
                    <span class="meta-item">

                      <span
                        class="language-dot"
                        style="background:${languageColor}"
                      ></span>

                      ${escapeHTML(
                        repo.language
                      )}

                    </span>
                  `
                  : ""
              }


              <span class="meta-item">
                ★ ${repo.stargazers_count}
              </span>


              <span class="meta-item">
                Forks ${repo.forks_count}
              </span>


              <span class="meta-item">
                Updated ${formatDate(
                  repo.updated_at
                )}
              </span>

            </div>


            <div class="repo-actions">

              <a
                class="button"
                href="${escapeHTML(githubUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                GitHub
              </a>


              <a
                class="button primary"
                href="${escapeHTML(liveUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Live Site
              </a>

            </div>

          </div>

        </article>
      `;
    }


    /* =========================================================
       LANGUAGE COLOUR
       ========================================================= */

    function getLanguageColor(language) {

      if (!language) {
        return "#8b949e";
      }

      return (
        LANGUAGE_COLORS[language] ||
        "#8b949e"
      );
    }


    /* =========================================================
       DATE
       ========================================================= */

    function formatDate(dateString) {

      const date =
        new Date(dateString);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "Unknown";
      }

      return date.toLocaleDateString(
        undefined,
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );
    }


    /* =========================================================
       HTML ESCAPING
       ========================================================= */

    function escapeHTML(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    searchInput.addEventListener(
      "input",
      renderRepositories
    );


    /* =========================================================
       SORT
       ========================================================= */

    sortSelect.addEventListener(
      "change",
      () => {

        localStorage.setItem(
          "git2358-sort",
          sortSelect.value
        );

        renderRepositories();
      }
    );


    /*
      Restore saved sort preference.
    */
    const savedSort =
      localStorage.getItem(
        "git2358-sort"
      );

    if (
      savedSort === "updated" ||
      savedSort === "created" ||
      savedSort === "name" ||
      savedSort === "stars"
    ) {
      sortSelect.value =
        savedSort;
    }


    /* =========================================================
       START
       ========================================================= */

    /*
      Remove old cache versions first.
    */
    cleanOldCache();


    /*
      Display valid cached repositories immediately.
    */
    loadCachedRepositories();


    /*
      Load profile.
    */
    loadProfile();


    /*
      Refresh repository list from GitHub.
    */
    loadRepositories();

  </script>

</body>
