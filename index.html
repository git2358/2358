  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0d1117;
    }

    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(13, 17, 23, 0.92);
      border-bottom: 1px solid #30363d;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
      font-size: 16px;
    }

    .github-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 18px;

      color: #8b949e;
      font-size: 14px;
    }

    .header-links a:hover {
      color: #e6edf3;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 42px 24px 80px;
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .profile {
      display: flex;
      align-items: center;
      gap: 24px;

      margin-bottom: 42px;
    }

    .avatar {
      width: 96px;
      height: 96px;

      border-radius: 50%;

      border: 1px solid #30363d;

      background: #161b22;

      object-fit: cover;

      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      margin: 0;

      font-size: 30px;
      line-height: 1.2;

      font-weight: 700;

      word-break: break-word;
    }

    .profile-username {
      margin-top: 3px;

      color: #8b949e;

      font-size: 16px;
    }

    .profile-bio {
      margin: 12px 0 0;

      color: #8b949e;

      max-width: 800px;
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;

      margin-top: 12px;

      color: #8b949e;
      font-size: 14px;
    }

    .profile-stats strong {
      color: #e6edf3;
      font-weight: 600;
    }

    /* =========================================================
       PROJECT HEADER
       ========================================================= */

    .projects-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }

    .projects-title {
      margin: 0;

      font-size: 24px;
      line-height: 1.3;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .search {
      width: 280px;
      max-width: 100%;

      padding: 9px 12px;

      color: #e6edf3;
      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 6px;

      outline: none;

      font: inherit;
      font-size: 14px;
    }

    .search:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(56, 139, 253, 0.15);
    }

    .sort {
      padding: 9px 12px;

      color: #e6edf3;
      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 6px;

      outline: none;

      font: inherit;
      font-size: 14px;

      cursor: pointer;
    }

    /* =========================================================
       PROJECT GRID
       ========================================================= */

    #repos {
      display: grid;

      /* iPhone / mobile */
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 22px;
    }

    /* iPad / tablet */
    @media (min-width: 700px) {
      #repos {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* Desktop */
    @media (min-width: 1000px) {
      #repos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* Keep 4 columns on very large screens */
    @media (min-width: 1500px) {
      #repos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* =========================================================
       PROJECT CARD
       ========================================================= */

    .repo-card {
      min-width: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 10px;

      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .repo-card:hover {
      border-color: #58a6ff;
      transform: translateY(-2px);
    }

    .repo-preview {
      position: relative;

      width: 100%;
      aspect-ratio: 1.91 / 1;

      background: #0d1117;

      overflow: hidden;
    }

    .repo-preview img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #0d1117;
    }

    .repo-content {
      display: flex;
      flex-direction: column;

      flex: 1;

      padding: 17px;
    }

    .repo-name {
      margin: 0;

      font-size: 17px;
      line-height: 1.35;

      font-weight: 600;

      word-break: break-word;
    }

    .repo-name a:hover {
      color: #58a6ff;
    }

    .repo-description {
      margin: 9px 0 0;

      color: #8b949e;

      font-size: 14px;
      line-height: 1.5;

      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    /* =========================================================
       TOPICS
       ========================================================= */

    .topics {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 13px;
    }

    .topic {
      padding: 3px 8px;

      border-radius: 20px;

      color: #58a6ff;
      background: rgba(56, 139, 253, 0.12);

      font-size: 11px;
      line-height: 1.4;
    }

    /* =========================================================
       REPO META
       ========================================================= */

    .repo-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: auto;
      padding-top: 17px;

      color: #8b949e;

      font-size: 12px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .language-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      display: inline-block;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .repo-actions {
      display: flex;

      gap: 8px;

      margin-top: 17px;
    }

    .button {
      flex: 1;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 0;

      padding: 8px 10px;

      border-radius: 6px;

      font-size: 12px;
      font-weight: 600;

      border: 1px solid #30363d;

      background: #21262d;

      color: #e6edf3;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .button:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    .button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: white;
    }

    .button.primary:hover {
      background: #2ea043;
    }

    /* =========================================================
       LOADING / EMPTY / ERROR
       ========================================================= */

    .status {
      grid-column: 1 / -1;

      padding: 40px 20px;

      text-align: center;

      color: #8b949e;
    }

    .status strong {
      color: #e6edf3;
    }

    /* =========================================================
       RESPONSIVE HEADER
       ========================================================= */

    @media (max-width: 900px) {
      .projects-header {
        align-items: stretch;
        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .search {
        flex: 1;
        width: auto;
      }
    }

    @media (max-width: 650px) {
      main {
        padding: 28px 14px 60px;
      }

      .header-inner {
        padding: 12px 14px;
      }

      .header-links {
        gap: 10px;
      }

      .profile {
        gap: 16px;
        margin-bottom: 30px;
      }

      .avatar {
        width: 72px;
        height: 72px;
      }

      .profile-name {
        font-size: 23px;
      }

      .profile-username {
        font-size: 14px;
      }

      .profile-bio {
        font-size: 13px;
      }

      .profile-stats {
        gap: 10px 14px;
        font-size: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .search,
      .sort {
        width: 100%;
      }

      #repos {
        gap: 12px;
      }

      .repo-content {
        padding: 12px;
      }

      .repo-description {
        font-size: 12px;

        -webkit-line-clamp: 3;
      }

      .repo-meta {
        gap: 8px;
        font-size: 10px;
      }

      .repo-actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (max-width: 450px) {
      .profile {
        align-items: flex-start;
      }

      .profile-name {
        font-size: 20px;
      }

      .repo-preview {
        aspect-ratio: 1.8 / 1;
      }

      .repo-name {
        font-size: 14px;
      }

      .topic {
        font-size: 9px;
        padding: 2px 6px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>

  </main>

  <script>
    /* =========================================================
       CONFIG
       ========================================================= */

    const username = "git2358";

    const CACHE_KEY = "git2358-repositories";
    const CACHE_TIME_KEY = "git2358-repositories-time";

    const CACHE_DURATION = 5 * 60 * 1000;


    /* =========================================================
       DOM
       ========================================================= */

    const reposContainer =
      document.getElementById("repos");

    const searchInput =
      document.getElementById("search");

    const sortSelect =
      document.getElementById("sort");

    const avatar =
      document.getElementById("avatar");

    const profileName =
      document.getElementById("profileName");

    const profileUsername =
      document.getElementById("profileUsername");

    const profileBio =
      document.getElementById("profileBio");

    const repoCount =
      document.getElementById("repoCount");

    const followers =
      document.getElementById("followers");

    const following =
      document.getElementById("following");


    /* =========================================================
       DATA
       ========================================================= */

    let repositories = [];

    let currentRepositorySignature = "";

    let hasRendered = false;


    /* =========================================================
       LANGUAGE COLOURS
       ========================================================= */

    const languageColors = {
      JavaScript: "#f1e05a",
      TypeScript: "#3178c6",
      HTML: "#e34c26",
      CSS: "#563d7c",
      Python: "#3572A5",
      Java: "#b07219",
      C: "#555555",
      "C++": "#f34b7d",
      "C#": "#178600",
      PHP: "#4F5D95",
      Ruby: "#701516",
      Go: "#00ADD8",
      Rust: "#dea584",
      Swift: "#F05138",
      Kotlin: "#A97BFF",
      Shell: "#89e051",
      Lua: "#000080",
      Dart: "#00B4AB",
      Vue: "#41b883",
      Svelte: "#ff3e00"
    };


    /* =========================================================
       GITHUB FETCH
       ========================================================= */

    async function githubFetch(url) {

      const response = await fetch(url, {
        headers: {
          Accept: "application/vnd.github+json"
        }
      });

      if (!response.ok) {
        throw new Error(
          `GitHub API error: ${response.status}`
        );
      }

      return response.json();
    }


    /* =========================================================
       AVATAR / FAVICON
       ========================================================= */

    function updateAvatarIcons(avatarUrl) {

      if (!avatarUrl) {
        return;
      }

      const favicon =
        document.getElementById("favicon");

      const appleTouchIcon =
        document.getElementById("appleTouchIcon");

      if (favicon) {
        favicon.href = avatarUrl;
      }

      if (appleTouchIcon) {
        appleTouchIcon.href = avatarUrl;
      }

      if (avatar) {
        avatar.src = avatarUrl;
      }
    }


    /* =========================================================
       PROFILE
       ========================================================= */

    async function loadProfile() {

      try {

        const user =
          await githubFetch(
            `https://api.github.com/users/${username}`
          );

        profileName.textContent =
          user.name || username;

        profileUsername.textContent =
          `@${user.login}`;

        profileBio.textContent =
          user.bio ||
          "GitHub projects and experiments.";

        followers.textContent =
          user.followers;

        following.textContent =
          user.following;

        updateAvatarIcons(user.avatar_url);

      } catch (error) {

        console.error(
          "Could not load GitHub profile:",
          error
        );

      }
    }


    /* =========================================================
       CACHE
       ========================================================= */

    function loadCachedRepositories() {

      try {

        const saved =
          localStorage.getItem(CACHE_KEY);

        const savedTime =
          localStorage.getItem(CACHE_TIME_KEY);

        if (!saved || !savedTime) {
          return false;
        }

        const age =
          Date.now() - Number(savedTime);

        if (age > CACHE_DURATION) {
          return false;
        }

        const cached =
          JSON.parse(saved);

        if (!Array.isArray(cached)) {
          return false;
        }

        repositories =
          cached;

        currentRepositorySignature =
          createRepositorySignature(
            repositories
          );

        updateRepositoryStats();

        renderRepositories();

        hasRendered = true;

        return true;

      } catch (error) {

        console.warn(
          "Could not load repository cache:",
          error
        );

        return false;
      }
    }


    function saveRepositoryCache(data) {

      try {

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(data)
        );

        localStorage.setItem(
          CACHE_TIME_KEY,
          String(Date.now())
        );

      } catch (error) {

        console.warn(
          "Could not save repository cache:",
          error
        );
      }
    }


    /* =========================================================
       REPOSITORY SIGNATURE
       =========================================================

       Used to avoid rebuilding the entire grid when GitHub
       returns exactly the same repository data.
       ========================================================= */

    function createRepositorySignature(data) {

      return data
        .map(repo => ({
          id: repo.id,
          name: repo.name,
          updated_at: repo.updated_at,
          created_at: repo.created_at,
          description: repo.description,
          topics: repo.topics,
          language: repo.language,
          stargazers_count: repo.stargazers_count,
          forks_count: repo.forks_count
        }))
        .sort((a, b) =>
          a.id - b.id
        );
    }


    /* =========================================================
       UPDATE REPO COUNT
       ========================================================= */

    function updateRepositoryStats() {

      repoCount.textContent =
        repositories.length;
    }


    /* =========================================================
       PROCESS REPOSITORIES
       ========================================================= */

    function processRepositories(data) {

      return data.filter(repo => {

        return (
          repo.owner &&
          repo.owner.login &&
          repo.owner.login.toLowerCase() ===
            username.toLowerCase() &&
          repo.fork === false
        );

      });
    }


    /* =========================================================
       LOAD ALL REPOSITORIES
       ========================================================= */

    async function loadRepositories() {

      try {

        /*
         * -----------------------------------------------------
         * First request
         * -----------------------------------------------------
         *
         * We render this batch once so the user doesn't stare
         * at a blank page while GitHub responds.
         */

        const firstPage =
          await githubFetch(
            `https://api.github.com/users/${username}/repos?per_page=100&page=1&sort=updated`
          );

        let allRepos =
          processRepositories(firstPage);

        repositories =
          allRepos;

        updateRepositoryStats();

        const firstSignature =
          JSON.stringify(
            createRepositorySignature(
              repositories
            )
          );

        /*
         * Only render the first batch if it is actually
         * different from what is already on screen.
         */

        if (
          !hasRendered ||
          firstSignature !== currentRepositorySignature
        ) {

          currentRepositorySignature =
            firstSignature;

          renderRepositories();

          hasRendered = true;
        }


        /*
         * -----------------------------------------------------
         * Additional pages
         * -----------------------------------------------------
         *
         * These are fetched silently.
         *
         * We DO NOT render after every page.
         */

        if (firstPage.length === 100) {

          let page = 2;

          while (true) {

            const nextPage =
              await githubFetch(
                `https://api.github.com/users/${username}/repos?per_page=100&page=${page}&sort=updated`
              );

            if (!nextPage.length) {
              break;
            }

            allRepos =
              allRepos.concat(
                processRepositories(nextPage)
              );

            if (nextPage.length < 100) {
              break;
            }

            page++;
          }
        }


        /*
         * -----------------------------------------------------
         * Final update
         * -----------------------------------------------------
         *
         * Render exactly once after all pages have arrived,
         * but only if something actually changed.
         */

        const finalSignature =
          JSON.stringify(
            createRepositorySignature(
              allRepos
            )
          );

        repositories =
          allRepos;

        updateRepositoryStats();

        if (
          finalSignature !==
          currentRepositorySignature
        ) {

          currentRepositorySignature =
            finalSignature;

          renderRepositories();
        }

        saveRepositoryCache(
          repositories
        );

      } catch (error) {

        console.error(
          "Could not load repositories:",
          error
        );

        /*
         * If we already have cached repositories, keep them
         * visible instead of replacing them with an error.
         */

        if (!repositories.length) {

          reposContainer.innerHTML = `
            <div class="status">
              <strong>Could not load projects.</strong><br>
              Please try again later.
            </div>
          `;
        }
      }
    }


    /* =========================================================
       RENDER REPOSITORIES
       ========================================================= */

    function renderRepositories() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();

      const sort =
        sortSelect.value;

      let filtered =
        repositories.filter(repo => {

          if (!query) {
            return true;
          }

          const searchableText = [
            repo.name,
            repo.description,
            ...(repo.topics || [])
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

          return searchableText.includes(query);
        });


      /* -------------------------------------------------------
         SORT
         ------------------------------------------------------- */

      filtered.sort((a, b) => {

        switch (sort) {

          case "name":

            return a.name.localeCompare(
              b.name
            );

          case "created":

            return new Date(b.created_at) -
                   new Date(a.created_at);

          case "stars":

            return (
              b.stargazers_count -
              a.stargazers_count
            );

          case "updated":
          default:

            return new Date(b.updated_at) -
                   new Date(a.updated_at);
        }
      });


      /* -------------------------------------------------------
         EMPTY
         ------------------------------------------------------- */

      if (!filtered.length) {

        reposContainer.innerHTML = `
          <div class="status">
            No projects found.
          </div>
        `;

        return;
      }


      /* -------------------------------------------------------
         BUILD ALL CARDS IN MEMORY
         -------------------------------------------------------
         Important for reducing visual flicker.
         The DOM is updated only once.
         ------------------------------------------------------- */

      const fragment =
        document.createDocumentFragment();

      const wrapper =
        document.createElement("div");

      wrapper.innerHTML =
        filtered
          .map(createRepositoryCard)
          .join("");


      while (wrapper.firstElementChild) {

        fragment.appendChild(
          wrapper.firstElementChild
        );
      }


      /* -------------------------------------------------------
         ONE DOM UPDATE
         ------------------------------------------------------- */

      reposContainer.replaceChildren(
        fragment
      );
    }


    /* =========================================================
       CREATE REPOSITORY CARD
       ========================================================= */

    function createRepositoryCard(repo) {

      const imageUrl =
        `https://opengraph.githubassets.com/1/${username}/${encodeURIComponent(repo.name)}`;

      const repoUrl =
        repo.html_url;

      const liveUrl =
        `https://${username}.github.io/${encodeURIComponent(repo.name)}/`;

      const languageColor =
        getLanguageColor(
          repo.language
        );

      const topics =
        (repo.topics || [])
          .map(topic => `
            <span class="topic">
              ${escapeHTML(topic)}
            </span>
          `)
          .join("");


      const description =
        repo.description ||
        "No description provided.";


      return `
        <article class="repo-card">

          <a
            class="repo-preview"
            href="${escapeHTML(repoUrl)}"
            target="_blank"
            rel="noopener"
            aria-label="Open ${escapeHTML(repo.name)} on GitHub"
          >
            <img
              src="${escapeHTML(imageUrl)}"
              alt=""
              loading="lazy"
              decoding="async"
              onerror="this.style.display='none'"
            >
          </a>


          <div class="repo-content">

            <h3 class="repo-name">

              <a
                href="${escapeHTML(repoUrl)}"
                target="_blank"
                rel="noopener"
              >
                ${escapeHTML(repo.name)}
              </a>

            </h3>


            <p class="repo-description">
              ${escapeHTML(description)}
            </p>


            ${
              topics
                ? `
                  <div class="topics">
                    ${topics}
                  </div>
                `
                : ""
            }


            <div class="repo-meta">

              ${
                repo.language
                  ? `
                    <span class="meta-item">

                      <span
                        class="language-dot"
                        style="background:${languageColor}"
                      ></span>

                      ${escapeHTML(repo.language)}

                    </span>
                  `
                  : ""
              }


              <span class="meta-item">
                ★ ${repo.stargazers_count}
              </span>


              <span class="meta-item">
                Forks ${repo.forks_count}
              </span>


              <span class="meta-item">
                Updated ${formatDate(repo.updated_at)}
              </span>

            </div>


            <div class="repo-actions">

              <a
                class="button"
                href="${escapeHTML(repoUrl)}"
                target="_blank"
                rel="noopener"
              >
                GitHub
              </a>


              <a
                class="button primary"
                href="${escapeHTML(liveUrl)}"
                target="_blank"
                rel="noopener"
              >
                Live Site
              </a>

            </div>

          </div>

        </article>
      `;
    }


    /* =========================================================
       LANGUAGE COLOUR
       ========================================================= */

    function getLanguageColor(language) {

      if (!language) {
        return "#8b949e";
      }

      return (
        languageColors[language] ||
        "#8b949e"
      );
    }


    /* =========================================================
       DATE FORMAT
       ========================================================= */

    function formatDate(dateString) {

      const date =
        new Date(dateString);

      return date.toLocaleDateString(
        undefined,
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );
    }


    /* =========================================================
       HTML ESCAPING
       ========================================================= */

    function escapeHTML(value) {

      if (value === null ||
          value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    searchInput.addEventListener(
      "input",
      () => {
        renderRepositories();
      }
    );


    /* =========================================================
       SORT
       ========================================================= */

    const savedSort =
      localStorage.getItem(
        "git2358-sort"
      );

    if (savedSort) {

      sortSelect.value =
        savedSort;
    }


    sortSelect.addEventListener(
      "change",
      () => {

        localStorage.setItem(
          "git2358-sort",
          sortSelect.value
        );

        renderRepositories();
      }
    );


    /* =========================================================
       START
       ========================================================= */

    /*
     * Load cached repositories immediately.
     *
     * If valid cache exists, the page can display projects
     * almost instantly while GitHub is refreshed in the
     * background.
     */

    loadCachedRepositories();


    /*
     * Load profile and fresh repository data.
     *
     * These run independently so the profile does not have
     * to wait for every repository request.
     */

    loadProfile();

    loadRepositories();

  </script>

</body>
</html>
