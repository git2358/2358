<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git2358 Repositories</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fff;
      color: #222;
    }

    h1 {
      margin-bottom: 30px;
    }

    #repos {
      display: grid;
      gap: 16px;
    }

    .repo {
      display: block;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .repo:hover {
      background: #f6f6f6;
      border-color: #aaa;
    }

    .repo-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .repo-description {
      color: #666;
      margin-bottom: 12px;
    }

    .repo-meta {
      font-size: 13px;
      color: #888;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <h1>git2358 Repositories</h1>

  <div id="repos">
    Loading...
  </div>

  <script>
    const username = "git2358";
    const reposContainer = document.getElementById("repos");

    async function loadRepositories() {
      try {
        const response = await fetch(
          `https://api.github.com/users/${username}/repos?type=owner&per_page=100&sort=updated`
        );

        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const repositories = await response.json();

        // Only show repositories actually owned by git2358
        // and exclude forks.
        const ownRepositories = repositories.filter(repo =>
          repo.owner.login.toLowerCase() === username.toLowerCase() &&
          repo.fork === false
        );

        reposContainer.innerHTML = "";

        if (ownRepositories.length === 0) {
          reposContainer.innerHTML = "<p>No repositories found.</p>";
          return;
        }

        ownRepositories.forEach(repo => {
          const item = document.createElement("a");

          item.className = "repo";
          item.href = repo.html_url;
          item.target = "_blank";
          item.rel = "noopener noreferrer";

          item.innerHTML = `
            <div class="repo-name">${escapeHTML(repo.name)}</div>

            <div class="repo-description">
              ${escapeHTML(
                repo.description || "No description provided."
              )}
            </div>

            <div class="repo-meta">
              ⭐ ${repo.stargazers_count}
              &nbsp; • &nbsp;
              🍴 ${repo.forks_count}
              &nbsp; • &nbsp;
              ${escapeHTML(repo.language || "Unknown")}
            </div>
          `;

          reposContainer.appendChild(item);
        });

      } catch (error) {
        console.error(error);

        reposContainer.innerHTML = `
          <p class="error">
            Unable to load repositories from GitHub.
          </p>
        `;
      }
    }

    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    loadRepositories();
  </script>

</body>
</html>
