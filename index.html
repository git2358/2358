<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0d1117"
  >

  <!-- =========================================================
       iOS / HOME SCREEN
       ========================================================= -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="2358"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!--
    IMPORTANT:
    iOS needs this declared directly in the HTML head.
    Do not rely on JavaScript to create it.

    This points directly at the GitHub profile avatar.
    JavaScript below will update it to the exact avatar_url
    returned by the GitHub API.
  -->
  <link
    id="appleTouchIcon"
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://avatars.githubusercontent.com/git2358"
  >

  <!-- Normal browser favicon -->
  <link
    id="favicon"
    rel="icon"
    type="image/png"
    href="https://avatars.githubusercontent.com/git2358"
  >

  <title>2358 — GitHub Projects</title>


  <style>

    /* =========================================================
       BASE
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: #0d1117;
      color: #e6edf3;

      line-height: 1.5;
    }

    a {
      color: inherit;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(1, 4, 9, .92);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border-bottom: 1px solid #30363d;

      padding: 14px 20px;
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      text-decoration: none;

      font-size: 18px;
      font-weight: 600;
    }

    .github-icon {
      width: 32px;
      height: 32px;

      fill: currentColor;
    }

    .github-link {
      color: #8b949e;

      text-decoration: none;

      font-size: 14px;

      transition: color .15s ease;
    }

    .github-link:hover,
    .github-link:focus {
      color: #58a6ff;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      max-width: 1280px;

      margin: auto;

      padding:
        55px 20px 90px;
    }


    /* =========================================================
       PROFILE
       ========================================================= */

    .profile {
      display: flex;

      align-items: center;

      gap: 30px;

      margin-bottom: 55px;
    }

    .avatar {
      width: 130px;
      height: 130px;

      flex-shrink: 0;

      border-radius: 50%;

      border: 1px solid #30363d;

      background: #161b22;

      object-fit: cover;

      box-shadow:
        0 0 0 6px rgba(255,255,255,.02);
    }

    .profile-info h1 {
      margin: 0 0 3px;

      font-size: 36px;

      font-weight: 600;

      letter-spacing: -.02em;
    }

    .username {
      color: #8b949e;

      font-size: 20px;

      margin-bottom: 15px;
    }

    .profile-description {
      color: #8b949e;

      max-width: 720px;

      line-height: 1.65;

      font-size: 15px;
    }


    /* =========================================================
       PROFILE STATS
       ========================================================= */

    .profile-stats {
      display: flex;

      flex-wrap: wrap;

      gap: 20px;

      margin-top: 20px;

      color: #8b949e;

      font-size: 13px;
    }

    .profile-stat {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .profile-stat strong {
      color: #e6edf3;

      font-weight: 600;
    }


    /* =========================================================
       PROJECT SECTION
       ========================================================= */

    .projects-section {
      margin-top: 10px;
    }

    .projects-header {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 25px;

      margin-bottom: 22px;
    }

    .projects-heading h2 {
      margin: 0;

      font-size: 24px;

      font-weight: 600;
    }

    .projects-heading p {
      margin: 5px 0 0;

      color: #8b949e;

      font-size: 14px;
    }


    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls {
      display: flex;

      gap: 8px;

      align-items: center;
    }

    .search,
    .sort {
      height: 38px;

      padding:
        0 12px;

      border-radius: 6px;

      border: 1px solid #30363d;

      background: #0d1117;

      color: #e6edf3;

      outline: none;

      font-family: inherit;

      font-size: 13px;
    }

    .search {
      width: 260px;
    }

    .search::placeholder {
      color: #6e7681;
    }

    .search:focus,
    .sort:focus {
      border-color: #58a6ff;

      box-shadow:
        0 0 0 3px rgba(56,139,253,.15);
    }

    .sort {
      cursor: pointer;
    }


    /* =========================================================
       PROJECT GRID
       ========================================================= */

    #repos {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;
    }


    /* =========================================================
       PROJECT CARD
       ========================================================= */

    .repo {
      overflow: hidden;

      border:
        1px solid #30363d;

      border-radius: 10px;

      background: #0d1117;

      transition:
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .repo:hover {
      border-color: #58a6ff;

      transform: translateY(-3px);

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);
    }


    /* =========================================================
       PROJECT PREVIEW
       ========================================================= */

    .repo-preview {
      position: relative;

      width: 100%;

      aspect-ratio: 2 / 1;

      overflow: hidden;

      background: #161b22;

      border-bottom:
        1px solid #30363d;
    }

    .repo-preview img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .3s ease,
        opacity .3s ease;
    }

    .repo:hover .repo-preview img {
      transform: scale(1.025);

      opacity: .95;
    }

    .repo-preview::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 55%,
          rgba(13,17,23,.35)
        );

      pointer-events: none;
    }


    /* =========================================================
       PROJECT CONTENT
       ========================================================= */

    .repo-content {
      padding: 22px;
    }

    .repo-name {
      margin-bottom: 9px;

      color: #58a6ff;

      font-size: 19px;

      font-weight: 600;

      letter-spacing: -.01em;

      word-break: break-word;
    }

    .repo-name::before {
      content: "▣";

      color: #8b949e;

      font-size: 15px;

      margin-right: 8px;
    }

    .repo-description {
      color: #8b949e;

      font-size: 14px;

      line-height: 1.6;

      min-height: 45px;

      margin-bottom: 15px;
    }


    /* =========================================================
       TOPICS
       ========================================================= */

    .topics {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-bottom: 17px;
    }

    .topic {
      padding:
        3px 9px;

      border-radius: 20px;

      background:
        rgba(56,139,253,.12);

      color: #58a6ff;

      font-size: 11px;

      line-height: 1.5;
    }


    /* =========================================================
       META
       ========================================================= */

    .repo-meta {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 15px;

      color: #8b949e;

      font-size: 12px;

      margin-bottom: 19px;
    }

    .language {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .language-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      flex-shrink: 0;
    }

    .stars,
    .forks {
      white-space: nowrap;
    }

    .updated {
      color: #6e7681;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .repo-links {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      padding-top: 15px;

      border-top:
        1px solid #21262d;
    }

    .repo-button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      min-height: 34px;

      padding:
        6px 12px;

      border:
        1px solid #30363d;

      border-radius: 6px;

      background: #21262d;

      color: #e6edf3;

      text-decoration: none;

      font-size: 12px;

      font-weight: 500;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .repo-button:hover,
    .repo-button:focus {
      background: #30363d;

      border-color: #8b949e;
    }

    .repo-button.live {
      color: #58a6ff;
    }


    /* =========================================================
       LOADING / ERROR
       ========================================================= */

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;

      padding: 55px 30px;

      text-align: center;

      border:
        1px solid #30363d;

      border-radius: 8px;

      color: #8b949e;
    }

    .error {
      color: #f85149;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      border-top:
        1px solid #21262d;

      padding:
        32px 20px;

      text-align: center;

      color: #6e7681;

      font-size: 13px;
    }

    footer a {
      color: #58a6ff;

      text-decoration: none;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 900px) {

      #repos {
        grid-template-columns: 1fr;
      }

      .projects-header {
        align-items: stretch;

        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .search {
        flex: 1;

        width: auto;
      }

    }


    @media (max-width: 650px) {

      main {
        padding:
          35px 15px 60px;
      }

      .profile {
        align-items: flex-start;

        gap: 18px;

        margin-bottom: 40px;
      }

      .avatar {
        width: 82px;
        height: 82px;
      }

      .profile-info h1 {
        font-size: 27px;
      }

      .username {
        font-size: 17px;

        margin-bottom: 9px;
      }

      .profile-description {
        font-size: 14px;
      }

      .profile-stats {
        gap: 12px;
      }

      .projects-heading h2 {
        font-size: 21px;
      }

      .controls {
        flex-direction: column;
      }

      .search,
      .sort {
        width: 100%;
      }

      .repo-content {
        padding: 18px;
      }

    }


    @media (max-width: 450px) {

      .profile {
        flex-direction: column;
      }

      .repo-preview {
        aspect-ratio: 1.8 / 1;
      }

    }

  </style>

</head>


<body>

  <script>

    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const username = "git2358";

    /*
     * Cache projects for 5 minutes.
     *
     * This means that when you open the site again,
     * the projects can appear immediately instead of
     * waiting for GitHub.
     */
    const CACHE_KEY = "git2358-repositories";
    const CACHE_TIME_KEY = "git2358-repositories-time";
    const CACHE_DURATION = 5 * 60 * 1000;


    /* =========================================================
       DOM
       ========================================================= */

    const reposContainer =
      document.getElementById("repos");

    const search =
      document.getElementById("search");

    const sort =
      document.getElementById("sort");

    let repositories = [];


    /* =========================================================
       LANGUAGE COLOURS
       ========================================================= */

    const languageColors = {

      "JavaScript": "#f1e05a",
      "TypeScript": "#3178c6",
      "HTML": "#e34c26",
      "CSS": "#563d7c",
      "SCSS": "#c6538c",
      "Python": "#3572A5",
      "Java": "#b07219",
      "C": "#555555",
      "C++": "#f34b7d",
      "C#": "#178600",
      "Objective-C": "#438eff",
      "Swift": "#F05138",
      "PHP": "#4F5D95",
      "Ruby": "#701516",
      "Go": "#00ADD8",
      "Rust": "#dea584",
      "Lua": "#000080",
      "Shell": "#89e051",
      "Dart": "#00B4AB",
      "Kotlin": "#A97BFF",
      "Assembly": "#6E4C13",
      "Makefile": "#427819"

    };


    /* =========================================================
       GITHUB API HELPER
       ========================================================= */

    async function githubFetch(url) {

      const response =
        await fetch(
          url,
          {
            headers: {
              "Accept":
                "application/vnd.github+json"
            }
          }
        );


      if (!response.ok) {

        if (response.status === 403) {

          throw new Error(
            "GitHub API rate limit reached. Please try again later."
          );

        }

        throw new Error(
          `GitHub returned ${response.status}`
        );

      }


      return response.json();

    }


    /* =========================================================
       UPDATE FAVICON
       ========================================================= */

    function updateAvatarIcons(avatarUrl) {

      if (!avatarUrl) {
        return;
      }


      /*
       * Update normal browser favicon.
       */

      document.getElementById("favicon").href =
        avatarUrl;


      /*
       * Update iOS Home Screen icon.
       *
       * The initial apple-touch-icon is already present
       * in <head> before JavaScript runs, which is important
       * for iOS.
       */

      document.getElementById("appleTouchIcon").href =
        avatarUrl;

    }


    /* =========================================================
       LOAD PROFILE
       ========================================================= */

    async function loadProfile() {

      try {

        const user =
          await githubFetch(
            `https://api.github.com/users/${username}`
          );


        /*
         * GitHub avatar
         */

        document.getElementById("avatar").src =
          user.avatar_url;


        updateAvatarIcons(
          user.avatar_url
        );


        /*
         * Profile information
         */

        document.getElementById("displayName").textContent =
          user.name || username;


        document.getElementById(
          "profileDescription"
        ).textContent =
          user.bio ||
          "GitHub projects and experiments by git2358.";


        document.getElementById(
          "followersStat"
        ).textContent =
          user.followers;


        document.getElementById(
          "followingStat"
        ).textContent =
          user.following;

      }


      catch (error) {

        console.error(error);

        document.getElementById(
          "profileDescription"
        ).textContent =
          "GitHub projects and experiments by git2358.";

      }

    }


    /* =========================================================
       CACHE HELPERS
       ========================================================= */

    function loadCachedRepositories() {

      try {

        const cached =
          localStorage.getItem(
            CACHE_KEY
          );

        const cachedTime =
          Number(
            localStorage.getItem(
              CACHE_TIME_KEY
            )
          );


        if (
          !cached ||
          !cachedTime ||
          Date.now() - cachedTime > CACHE_DURATION
        ) {

          return false;

        }


        const data =
          JSON.parse(cached);


        if (!Array.isArray(data)) {
          return false;
        }


        repositories =
          data;


        updateRepositoryStats();

        renderRepositories();


        return true;

      }


      catch (error) {

        console.warn(
          "Unable to load cached repositories:",
          error
        );

        return false;

      }

    }


    function saveRepositoryCache(data) {

      try {

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(data)
        );

        localStorage.setItem(
          CACHE_TIME_KEY,
          Date.now().toString()
        );

      }


      catch (error) {

        console.warn(
          "Unable to save repository cache:",
          error
        );

      }

    }


    /* =========================================================
       REPOSITORY STATS
       ========================================================= */

    function updateRepositoryStats() {

      document.getElementById(
        "repoCount"
      ).textContent =
        `(${repositories.length})`;


      document.getElementById(
        "repoStat"
      ).textContent =
        repositories.length;

    }


    /* =========================================================
       PROCESS REPOSITORIES
       ========================================================= */

    function processRepositories(data) {

      return data.filter(repo =>

        repo.owner &&
        repo.owner.login &&
        repo.owner.login.toLowerCase() ===
          username.toLowerCase()

        &&

        repo.fork === false

      );

    }


    /* =========================================================
       LOAD REPOSITORIES
       ========================================================= */

    async function loadRepositories() {

      try {

        let page = 1;

        const allRepositories = [];


        /*
         * -----------------------------------------------------
         * FIRST PAGE
         * -----------------------------------------------------
         *
         * Load the first 100 repositories.
         *
         * As soon as these arrive, display them.
         * We don't wait for additional pages.
         */

        const firstPage =
          await githubFetch(

            `https://api.github.com/users/${username}/repos` +
            `?type=owner&per_page=100&page=${page}&sort=updated`

          );


        allRepositories.push(
          ...firstPage
        );


        repositories =
          processRepositories(
            allRepositories
          );


        updateRepositoryStats();

        renderRepositories();


        /*
         * -----------------------------------------------------
         * ADDITIONAL PAGES
         * -----------------------------------------------------
         *
         * If there are more than 100 repositories,
         * continue loading them in the background.
         */

        while (
          firstPage.length === 100
        ) {

          page++;


          const pageData =
            await githubFetch(

              `https://api.github.com/users/${username}/repos` +
              `?type=owner&per_page=100&page=${page}&sort=updated`

            );


          allRepositories.push(
            ...pageData
          );


          /*
           * Update the screen after each additional page.
           */

          repositories =
            processRepositories(
              allRepositories
            );


          updateRepositoryStats();

          renderRepositories();


          if (
            pageData.length < 100
          ) {

            break;

          }

        }


        /*
         * Save the complete result.
         */

        saveRepositoryCache(
          repositories
        );

      }


      catch (error) {

        console.error(error);


        /*
         * If we already have cached projects,
         * don't replace them with an error.
         */

        if (
          repositories.length > 0
        ) {

          return;

        }


        reposContainer.innerHTML = `

          <div class="error">

            Unable to load projects from GitHub.

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }

    }


    /* =========================================================
       RENDER
       ========================================================= */

    function renderRepositories() {

      const query =
        search.value
          .trim()
          .toLowerCase();


      let filtered =
        repositories.filter(repo => {

          return (

            repo.name
              .toLowerCase()
              .includes(query)

            ||

            (repo.description || "")
              .toLowerCase()
              .includes(query)

            ||

            (repo.topics || [])
              .some(topic =>
                topic
                  .toLowerCase()
                  .includes(query)
              )

          );

        });


      /* =======================================================
         SORT
         ======================================================= */

      switch (sort.value) {


        case "created":

          filtered.sort(
            (a, b) =>
              new Date(b.created_at) -
              new Date(a.created_at)
          );

          break;


        case "stars":

          filtered.sort(
            (a, b) =>
              b.stargazers_count -
              a.stargazers_count
          );

          break;


        case "forks":

          filtered.sort(
            (a, b) =>
              b.forks_count -
              a.forks_count
          );

          break;


        case "name":

          filtered.sort(
            (a, b) =>
              a.name.localeCompare(
                b.name,
                undefined,
                {
                  sensitivity: "base"
                }
              )
          );

          break;


        case "updated":

        default:

          filtered.sort(
            (a, b) =>
              new Date(b.updated_at) -
              new Date(a.updated_at)
          );

          break;

      }


      reposContainer.innerHTML = "";


      if (filtered.length === 0) {

        reposContainer.innerHTML = `

          <div class="empty">
            No projects found.
          </div>

        `;

        return;

      }


      /* =======================================================
         CARDS
         ======================================================= */

      filtered.forEach(repo => {

        const item =
          document.createElement("article");


        item.className = "repo";


        const language =
          repo.language || "Other";


        const languageColor =
          getLanguageColor(
            repo.language
          );


        const updated =
          formatDate(
            repo.updated_at
          );


        /*
         * GitHub Open Graph project image.
         */

        const previewUrl =
          `https://opengraph.githubassets.com/1/` +
          `${username}/${encodeURIComponent(repo.name)}`;


        /*
         * Topics
         */

        const topics =
          (repo.topics || [])
            .slice(0, 8)
            .map(topic =>

              `<span class="topic">
                ${escapeHTML(topic)}
              </span>`

            )
            .join("");


        const topicsHTML =
          topics

            ? `<div class="topics">${topics}</div>`

            : "";


        /*
         * GitHub Pages URL
         */

        const pagesUrl =
          `https://${username}.github.io/` +
          `${encodeURIComponent(repo.name)}/`;


        item.innerHTML = `

          <!-- PROJECT PREVIEW -->

          <div class="repo-preview">

            <a
              href="${repo.html_url}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open ${escapeHTML(repo.name)} on GitHub"
            >

              <img
                src="${previewUrl}"
                alt="${escapeHTML(repo.name)} project preview"
                loading="lazy"
                onerror="this.style.display='none'"
              >

            </a>

          </div>


          <!-- PROJECT CONTENT -->

          <div class="repo-content">

            <div class="repo-name">
              ${escapeHTML(repo.name)}
            </div>


            <div class="repo-description">

              ${escapeHTML(
                repo.description ||
                "No description provided."
              )}

            </div>


            ${topicsHTML}


            <div class="repo-meta">

              <span class="language">

                <span
                  class="language-dot"
                  style="background:${languageColor}"
                ></span>

                ${escapeHTML(language)}

              </span>


              <span class="stars">
                ★ ${repo.stargazers_count}
              </span>


              <span class="forks">
                ⑂ ${repo.forks_count}
              </span>


              <span class="updated">
                Updated ${updated}
              </span>

            </div>


            <div class="repo-links">

              <a
                class="repo-button"
                href="${repo.html_url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ◇ GitHub
              </a>


              <a
                class="repo-button live"
                href="${pagesUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ↗ Live Site
              </a>

            </div>

          </div>

        `;


        reposContainer.appendChild(item);

      });

    }


    /* =========================================================
       LANGUAGE COLOUR
       ========================================================= */

    function getLanguageColor(language) {

      return (
        languageColors[language] ||
        "#8b949e"
      );

    }


    /* =========================================================
       DATE
       ========================================================= */

    function formatDate(date) {

      return new Date(date)
        .toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );

    }


    /* =========================================================
       HTML ESCAPING
       ========================================================= */

    function escapeHTML(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value;


      return div.innerHTML;

    }


    /* =========================================================
       SEARCH
       ========================================================= */

    search.addEventListener(
      "input",
      renderRepositories
    );


    /* =========================================================
       SORT
       ========================================================= */

    const savedSort =
      localStorage.getItem(
        "git2358-sort"
      );


    if (savedSort) {

      sort.value =
        savedSort;

    }


    sort.addEventListener(
      "change",
      () => {

        localStorage.setItem(
          "git2358-sort",
          sort.value
        );

        renderRepositories();

      }
    );


    /* =========================================================
       START
       ========================================================= */

    /*
     * 1. Try cached projects immediately.
     *
     * 2. Start profile and GitHub repository loading
     *    at the same time.
     *
     * 3. GitHub data silently replaces the cached data.
     */

    const hasCache =
      loadCachedRepositories();


    /*
     * Start both requests concurrently.
     */

    loadProfile();

    loadRepositories();

  </script>


</body>
</html>
