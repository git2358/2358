<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2358 — GitHub Projects</title>

  <!-- GitHub avatar used as favicon -->
  <link
    id="favicon"
    rel="icon"
    type="image/png"
    href="https://github.com/git2358.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: #0d1117;
      color: #e6edf3;
    }

    a {
      color: inherit;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      background: #010409;
      border-bottom: 1px solid #30363d;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;

      font-weight: 600;
      font-size: 18px;
    }

    .github-icon {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .github-link {
      color: #8b949e;
      text-decoration: none;
      font-size: 14px;
    }

    .github-link:hover,
    .github-link:focus {
      color: #58a6ff;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 50px 20px 80px;
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .profile {
      display: flex;
      gap: 28px;
      align-items: center;

      margin-bottom: 35px;
    }

    .avatar {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      border: 1px solid #30363d;

      background: #161b22;

      object-fit: cover;

      flex-shrink: 0;
    }

    .profile-info h1 {
      margin: 0 0 6px;

      font-size: 32px;
      font-weight: 600;
    }

    .username {
      color: #8b949e;
      font-size: 20px;

      margin-bottom: 14px;
    }

    .profile-description {
      color: #8b949e;

      line-height: 1.6;

      max-width: 700px;
    }

    /* =========================================================
       PROFILE STATS
       ========================================================= */

    .profile-stats {
      display: flex;
      flex-wrap: wrap;

      gap: 20px;

      margin-top: 18px;

      color: #8b949e;

      font-size: 13px;
    }

    .profile-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-stat strong {
      color: #e6edf3;
      font-weight: 600;
    }

    /* =========================================================
       SECTION HEADERS
       ========================================================= */

    .section {
      margin-top: 45px;
    }

    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 20px;
      font-weight: 600;
    }

    .count {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 26px;
      height: 22px;

      padding: 0 7px;

      border-radius: 20px;

      background: #21262d;

      color: #8b949e;

      font-size: 12px;
      font-weight: 600;
    }

    /* =========================================================
       FEATURED PROJECTS
       ========================================================= */

    #featured {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }

    .featured-card {
      position: relative;

      border: 1px solid #30363d;

      border-radius: 8px;

      padding: 22px;

      background: #161b22;

      transition:
        border-color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
    }

    .featured-card:hover {
      border-color: #58a6ff;

      transform: translateY(-2px);

      box-shadow:
        0 5px 20px rgba(0,0,0,.25);
    }

    .featured-label {
      color: #8b949e;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .08em;

      margin-bottom: 10px;
    }

    .featured-name {
      color: #58a6ff;

      font-size: 18px;

      font-weight: 600;

      margin-bottom: 10px;

      word-break: break-word;
    }

    .featured-description {
      color: #8b949e;

      font-size: 13px;

      line-height: 1.55;

      min-height: 62px;

      margin-bottom: 16px;
    }

    /* =========================================================
       REPOSITORY CONTROLS
       ========================================================= */

    .repo-controls {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;
    }

    .controls-right {
      display: flex;

      gap: 8px;
    }

    .search,
    .sort {
      padding: 9px 12px;

      border-radius: 6px;

      border: 1px solid #30363d;

      background: #0d1117;
      color: #e6edf3;

      outline: none;

      font-size: 14px;
    }

    .search {
      width: 280px;
    }

    .sort {
      cursor: pointer;
    }

    .search::placeholder {
      color: #6e7681;
    }

    .search:focus,
    .sort:focus {
      border-color: #58a6ff;

      box-shadow:
        0 0 0 2px rgba(56,139,253,.25);
    }

    /* =========================================================
       REPOSITORIES GRID
       ========================================================= */

    #repos {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .repo {
      border: 1px solid #30363d;

      border-radius: 6px;

      padding: 20px;

      background: #0d1117;

      transition:
        border-color .15s ease,
        background .15s ease,
        transform .15s ease;
    }

    .repo:hover {
      border-color: #58a6ff;
      background: #161b22;
      transform: translateY(-1px);
    }

    .repo-name {
      color: #58a6ff;

      font-size: 17px;

      font-weight: 600;

      margin-bottom: 10px;

      word-break: break-word;
    }

    .repo-name::before {
      content: "▣";

      margin-right: 8px;

      color: #8b949e;
    }

    .repo-description {
      color: #8b949e;

      font-size: 14px;

      line-height: 1.5;

      min-height: 42px;

      margin-bottom: 15px;
    }

    /* =========================================================
       TOPICS
       ========================================================= */

    .topics {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-bottom: 17px;
    }

    .topic {
      display: inline-block;

      padding: 3px 8px;

      border-radius: 20px;

      background: rgba(56,139,253,.12);

      color: #58a6ff;

      font-size: 11px;

      line-height: 1.4;
    }

    /* =========================================================
       REPO META
       ========================================================= */

    .repo-meta {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 16px;

      color: #8b949e;

      font-size: 12px;

      margin-bottom: 18px;
    }

    .language {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .language-dot {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #8b949e;
    }

    .stars,
    .forks {
      white-space: nowrap;
    }

    .updated {
      color: #6e7681;
    }

    /* =========================================================
       REPO LINKS
       ========================================================= */

    .repo-links {
      display: flex;

      gap: 8px;

      padding-top: 14px;

      border-top: 1px solid #21262d;
    }

    .repo-button {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 7px 11px;

      border-radius: 6px;

      border: 1px solid #30363d;

      background: #21262d;

      color: #e6edf3;

      font-size: 12px;

      text-decoration: none;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .repo-button:hover,
    .repo-button:focus {
      background: #30363d;

      border-color: #8b949e;
    }

    .repo-button.live {
      color: #58a6ff;
    }

    /* =========================================================
       STATES
       ========================================================= */

    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;

      padding: 40px;

      text-align: center;

      border: 1px solid #30363d;

      border-radius: 6px;

      color: #8b949e;
    }

    .error {
      color: #f85149;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      border-top: 1px solid #21262d;

      text-align: center;

      padding: 30px 20px;

      color: #6e7681;

      font-size: 13px;
    }

    footer a {
      color: #58a6ff;

      text-decoration: none;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 900px) {

      #featured {
        grid-template-columns: 1fr;
      }

      .repo-controls {
        align-items: stretch;

        flex-direction: column;
      }

      .controls-right {
        display: grid;

        grid-template-columns: 1fr 1fr;
      }

      .search {
        width: 100%;
      }

    }

    @media (max-width: 700px) {

      main {
        padding-top: 30px;
      }

      .profile {
        align-items: flex-start;

        gap: 18px;
      }

      .avatar {
        width: 80px;
        height: 80px;
      }

      .profile-info h1 {
        font-size: 25px;
      }

      .username {
        font-size: 17px;
      }

      .profile-stats {
        gap: 12px;
      }

      #repos {
        grid-template-columns: 1fr;
      }

      .repo-links {
        flex-wrap: wrap;
      }

    }

    @media (max-width: 500px) {

      .profile {
        flex-direction: column;
      }

      .controls-right {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }

      .github-link {
        display: none;
      }

    }

  </style>
</head>

<body>

  <div class="header-inner">

    <a
      class="brand"
      href="https://github.com/git2358"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="git2358 on GitHub"
    >

      <svg

<main>

  <!-- =======================================================
       PROFILE
       ======================================================= -->

  <section class="profile">

    <img
      id="avatar"
      class="avatar"
      src="https://github.com/git2358.png"
      alt="git2358 avatar"
    >

    <div class="profile-info">

      <h1 id="displayName">
        git2358
      </h1>

      <div class="username">
        @git2358
      </div>

      <div
        id="profileDescription"

      >
        Loading GitHub profile...
      </div>

      <div class="profile-stats">

        <span class="profile-stat">
          <strong id="repoStat">—</strong>
          repositories
        </span>

        <span class="profile-stat">
          <strong id="followersStat">—</strong>
          followers
        </span>

        <span class="profile-stat">
          <strong id="followingStat">—</strong>
          following
        </span>

      </div>

    </div>

  </section>


  <!-- =======================================================
       FEATURED
       ======================================================= -->

  <section
    id="featuredSection"
    class="section"
  >

    <div class="section-header">

      <div class="section-title">

        <h2>Featured Projects</h2>

      </div>

    </div>

    <div id="featured">

      <div class="loading">
        Loading featured projects...
      </div>

    </div>

  </section>


  <!-- =======================================================
       ALL REPOSITORIES
       ======================================================= -->

  <section class="section">

    <div class="section-header">

      <div class="section-title">

        <h2>Repositories</h2>

        <span
          id="repoCount"
          class="count"
        >
          —
        </span>

      </div>

    </div>


    <div class="repo-controls">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Find a repository..."
        aria-label="Search repositories"
      >

      <div class="controls-right">

        <select
          id="sort"
          class="sort"
          aria-label="Sort repositories"
        >

          <option value="updated">
            Recently updated
          </option>

          <option value="created">
            Recently created
          </option>

          <option value="stars">
            Most stars
          </option>

<footer>

  <a
    href="https://github.com/git2358"
    target="_blank"
    rel="noopener noreferrer"
  >
    github.com/git2358
  </a>

</footer>


<script>

  /* =========================================================
     CONFIGURATION
     ========================================================= */

  const username = "git2358";


  /*
   * Put repository names here that you want to appear
   * in the Featured Projects section.
   *
   * The order here controls the order displayed.
   *
   * Example:
   *
   * const featuredProjects = [
   *   "zine",
   *   "gameboy-camera",
   *   "gamecube-banner-editor"
   * ];
   */

  const featuredProjects = [
    "zine"
  ];


  /*
   * Put repository names here that definitely have
   * a GitHub Pages website.
   *
   * This is deliberately manual rather than guessing.
   *
   * Example:
   *
   * const liveSites = [
   *   "zine",
   *   "gameboy-camera"
   * ];
   */

  const liveSites = [
    "zine"
  ];


  /*
   * GitHub-style language colours.
   *
   * These are only used for the small language dot.
   */

  const languageColors = {

    "JavaScript": "#f1e05a",
    "TypeScript": "#3178c6",
    "HTML": "#e34c26",
    "CSS": "#563d7c",
    "SCSS": "#c6538c",
    "Python": "#3572A5",
    "Java": "#b07219",
    "C": "#555555",
    "C++": "#f34b7d",
    "C#": "#178600",
    "Objective-C": "#438eff",
    "Swift": "#F05138",
    "PHP": "#4F5D95",
    "Ruby": "#701516",
    "Go": "#00ADD8",
    "Rust": "#dea584",
    "Lua": "#000080",
    "Shell": "#89e051",
    "Dart": "#00B4AB",
    "Kotlin": "#A97BFF",
    "Assembly": "#6E4C13",
    "Makefile": "#427819"

  };


  /* =========================================================
     DOM
     ========================================================= */

  const reposContainer =
    document.getElementById("repos");

  const featuredContainer =
    document.getElementById("featured");

  const search =
    document.getElementById("search");

  const sort =
    document.getElementById("sort");

  let repositories = [];


  /* =========================================================
     GITHUB API
     ========================================================= */

  async function githubFetch(url) {

    const response = await fetch(url, {
      headers: {
        "Accept": "application/vnd.github+json"
      }
    });

    if (!response.ok) {

      if (response.status === 403) {
        throw new Error(
          "GitHub API rate limit reached. Please try again later."
        );
      }

      throw new Error(
        `GitHub returned ${response.status}`
      );

    }

    return response.json();

  }


  /* =========================================================
     LOAD PROFILE
     ========================================================= */

  async function loadProfile() {

    try {

      const user =
        await githubFetch(
          `https://api.github.com/users/${username}`
        );


      /*
       * Avatar
       */

      document.getElementById("avatar").src =
        user.avatar_url;


      /*
       * Favicon
       */

      document.getElementById("favicon").href =
        user.avatar_url;


      /*
       * Name
       */

      document.getElementById("displayName").textContent =
        user.name || username;


      /*
       * Bio
       */

      document.getElementById("profileDescription").textContent =
        user.bio ||
        "GitHub projects and experiments by git2358.";


      /*
       * Stats
       */

      document.getElementById("repoStat").textContent =
        user.public_repos;

      document.getElementById("followersStat").textContent =
        user.followers;

      document.getElementById("followingStat").textContent =
        user.following;

    }

    catch (error) {

      console.error(error);

      document.getElementById(
        "profileDescription"
      ).textContent =
        "GitHub projects and experiments by git2358.";

    }

  }


  /* =========================================================
     LOAD ALL REPOSITORIES
     ========================================================= */

  async function loadRepositories() {

    try {

      let page = 1;

      const allRepositories = [];


      /*
       * GitHub allows up to 100 repositories per page.
       *
       * Continue requesting pages until fewer than 100
       * repositories are returned.
       */

      while (true) {

        const pageData =
          await githubFetch(
            `https://api.github.com/users/${username}/repos` +
            `?type=owner&per_page=100&page=${page}&sort=updated`
          );


        allRepositories.push(...pageData);


        if (pageData.length < 100) {
          break;
        }


        page++;

      }


      /*
       * Only keep:
       *
       * - repositories actually owned by git2358
       * - repositories that are not forks
       */

      repositories =
        allRepositories.filter(repo =>

          repo.owner.login.toLowerCase() ===
            username.toLowerCase()

          &&

          repo.fork === false

        );


      /*
       * Update count
       */

      document.getElementById("repoCount").textContent =
        repositories.length;


      document.getElementById("repoStat").textContent =
        repositories.length;


      /*
       * Render
       */

      renderFeatured();

      renderRepositories();

    }

    catch (error) {

      console.error(error);

      featuredContainer.innerHTML = `
        <div class="error">
          ${escapeHTML(error.message)}
        </div>
      `;

      reposContainer.innerHTML = `
        <div class="error">
          Unable to load repositories from GitHub.
          <br><br>
          ${escapeHTML(error.message)}
        </div>
      `;

    }

  }


  /* =========================================================
     RENDER FEATURED PROJECTS
     ========================================================= */

  function renderFeatured() {

    const featured =
      featuredProjects

        .map(name =>

          repositories.find(repo =>
            repo.name.toLowerCase() ===
            name.toLowerCase()
          )

        )

        .filter(Boolean);


    /*
     * Hide section completely when there are no
     * configured featured projects.
     */

    if (featured.length === 0) {

      document.getElementById(
        "featuredSection"
      ).style.display = "none";

      return;

    }


    featuredContainer.innerHTML = "";


    featured.forEach(repo => {

      const item =
        document.createElement("article");

      item.className =
        "featured-card";


      const pagesUrl =
        getPagesUrl(repo);


      const liveButton =
        pagesUrl

          ? `
            <a
              class="repo-button live"
              href="${pagesUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ↗ Live Site
            </a>
          `

          : "";


      item.innerHTML = `

        <div class="featured-label">
          Featured Project
        </div>

        <div class="featured-name">
          ${escapeHTML(repo.name)}
        </div>

        <div class="featured-description">
          ${escapeHTML(
            repo.description ||
            "No description provided."
          )}
        </div>

        <div class="repo-meta">

          <span class="language">

            <span
              class="language-dot"
              style="background:${getLanguageColor(repo.language)}"
            ></span>

            ${escapeHTML(repo.language || "Other")}

          </span>

          <span class="stars">
            ★ ${repo.stargazers_count}
          </span>

        </div>

        <div class="repo-links">

          <a
            class="repo-button"
            href="${repo.html_url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ◇ GitHub
          </a>

          ${liveButton}

        </div>

      `;


      featuredContainer.appendChild(item);

    });

  }


  /* =========================================================
     RENDER REPOSITORIES
     ========================================================= */

  function renderRepositories() {

    const query =
      search.value
        .trim()
        .toLowerCase();


    let filtered =
      repositories.filter(repo => {

        return (

          repo.name
            .toLowerCase()
            .includes(query)

          ||

          (repo.description || "")
            .toLowerCase()
            .includes(query)

          ||

          (repo.topics || [])
            .some(topic =>
              topic.toLowerCase().includes(query)
            )

        );

      });


    /*
     * SORT
     */

    switch (sort.value) {

      case "created":

        filtered.sort(
          (a, b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        );

        break;


      case "stars":

        filtered.sort(
          (a, b) =>
            b.stargazers_count -
            a.stargazers_count
        );

        break;


      case "forks":

        filtered.sort(
          (a, b) =>
            b.forks_count -
            a.forks_count
        );

        break;


      case "name":

        filtered.sort(
          (a, b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              {
                sensitivity: "base"
              }
            )
        );

        break;


      case "updated":

      default:

        filtered.sort(
          (a, b) =>
            new Date(b.updated_at) -
            new Date(a.updated_at)
        );

        break;

    }


    reposContainer.innerHTML = "";


    if (filtered.length === 0) {

      reposContainer.innerHTML = `
        <div class="empty">
          No repositories found.
        </div>
      `;

      return;

    }


    filtered.forEach(repo => {

      const item =
        document.createElement("article");

      item.className = "repo";


      const language =
        repo.language || "Other";


      const updated =
        formatDate(repo.updated_at);


      const pagesUrl =
        getPagesUrl(repo);


      /*
       * Topics
       */

      const topics =
        (repo.topics || [])
          .slice(0, 6)
          .map(topic =>

            `<span class="topic">
              ${escapeHTML(topic)}
            </span>`

          )
          .join("");


      const topicsHTML =
        topics

          ? `<div class="topics">${topics}</div>`

          : "";


      /*
       * Live Site button
       */

      const liveButton =
        pagesUrl

          ? `
            <a
              class="repo-button live"
              href="${pagesUrl}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open live site for ${escapeHTML(repo.name)}"
            >
              ↗ Live Site
            </a>
          `

          : "";


      item.innerHTML = `

        <div class="repo-name">
          ${escapeHTML(repo.name)}
        </div>

        <div class="repo-description">
          ${escapeHTML(
            repo.description ||
            "No description provided."
          )}
        </div>

        ${topicsHTML}

        <div class="repo-meta">

          <span class="language">

            <span
              class="language-dot"
              style="background:${getLanguageColor(repo.language)}"
            ></span>

            ${escapeHTML(language)}

          </span>

          <span class="stars">
            ★ ${repo.stargazers_count}
          </span>

          <span class="forks">
            ⑂ ${repo.forks_count}
          </span>

          <span class="updated">
            Updated ${updated}
          </span>

        </div>

        <div class="repo-links">

          <a
            class="repo-button"
            href="${repo.html_url}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open ${escapeHTML(repo.name)} on GitHub"
          >
            ◇ GitHub
          </a>

          ${liveButton}

        </div>

      `;


      reposContainer.appendChild(item);

    });

  }


  /* =========================================================
     GITHUB PAGES URL
     ========================================================= */

  function getPagesUrl(repo) {

    /*
     * Only display Live Site when the repository has
     * been manually configured in liveSites.
     */

    const enabled =
      liveSites.some(name =>
        name.toLowerCase() ===
        repo.name.toLowerCase()
      );


    if (!enabled) {
      return null;
    }


    return (
      `https://${username}.github.io/` +
      `${encodeURIComponent(repo.name)}/`
    );

  }


  /* =========================================================
     LANGUAGE COLOUR
     ========================================================= */

  function getLanguageColor(language) {

    return (
      languageColors[language] ||
      "#8b949e"
    );

  }


  /* =========================================================
     DATE
     ========================================================= */

  function formatDate(date) {

    const d =
      new Date(date);


    return d.toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");


    div.textContent =
      value;


    return div.innerHTML;

  }


  /* =========================================================
     SEARCH
     ========================================================= */

  search.addEventListener(
    "input",
    renderRepositories
  );


  /* =========================================================
     SORT
     ========================================================= */

  /*
   * Remember selected sort order.
   */

  const savedSort =
    localStorage.getItem(
      "git2358-sort"
    );


  if (savedSort) {

    sort.value =
      savedSort;

  }


  sort.addEventListener(
    "change",
    () => {

      localStorage.setItem(
        "git2358-sort",
        sort.value
      );

      renderRepositories();

    }
  );


  /* =========================================================
     START
     ========================================================= */

  loadProfile();

  loadRepositories();

</script>

</body>
</html>
